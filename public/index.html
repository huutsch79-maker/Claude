<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>JARVIS</title>
<style>
  :root {
    --bg: #0b0e14; --bg-elev: #10141c; --panel: #141922; --border: #232a37; --text: #e8ebf1; --muted: #8b93a7;
    --accent: #5b8cff; --accent-soft: rgba(91,140,255,0.14);
    --ok: #34c98f; --warn: #ffb454; --danger: #ff5c5c;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; overflow: hidden; }
  #app { display: flex; height: 100vh; }

  /* --- sidebar --- */
  .sidebar { width: 320px; min-width: 320px; background: var(--bg-elev); border-right: 1px solid var(--border); display: flex; flex-direction: column; overflow-y: auto; }
  .sidebar-header { padding: 18px 18px 12px; display: flex; align-items: center; justify-content: space-between; }
  .sidebar-header h1 { font-size: 15px; margin: 0; font-weight: 700; letter-spacing: 0.01em; display: flex; align-items: center; gap: 8px; }
  .status-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
  .status-dot.ok { background: var(--ok); box-shadow: 0 0 0 3px rgba(52,201,143,0.15); }
  .status-dot.err { background: var(--danger); box-shadow: 0 0 0 3px rgba(255,92,92,0.15); }
  .icon-btn { background: transparent; border: none; color: var(--muted); cursor: pointer; padding: 4px; border-radius: 6px; font-size: 16px; line-height: 1; }
  .icon-btn:hover { background: var(--panel); color: var(--text); }

  .section { padding: 10px 18px 16px; border-bottom: 1px solid var(--border); }
  .section h2 { font-size: 11px; text-transform: uppercase; letter-spacing: 0.07em; color: var(--muted); margin: 0 0 10px; display: flex; align-items: center; justify-content: space-between; }
  .count-badge { background: var(--accent-soft); color: var(--accent); border-radius: 10px; padding: 1px 7px; font-size: 11px; font-weight: 600; }

  .item-row { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; padding: 7px 0; border-bottom: 1px solid rgba(255,255,255,0.04); font-size: 13px; }
  .item-row:last-child { border-bottom: none; }
  .item-main { min-width: 0; }
  .item-title { color: var(--text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .item-sub { color: var(--muted); font-size: 11.5px; margin-top: 1px; }
  .cat-chip { display: inline-block; font-size: 10px; padding: 1px 6px; border-radius: 8px; background: rgba(255,255,255,0.06); color: var(--muted); margin-left: 6px; }

  button { background: var(--panel); border: 1px solid var(--border); color: var(--text); padding: 5px 10px; border-radius: 7px; font-size: 12.5px; cursor: pointer; white-space: nowrap; }
  button:hover { border-color: var(--accent); }
  button:disabled { opacity: 0.5; cursor: default; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button.danger { background: transparent; border-color: var(--danger); color: var(--danger); }
  button.tiny { padding: 3px 8px; font-size: 11.5px; }
  .btn-row { display: flex; gap: 6px; flex-shrink: 0; }

  .empty { color: var(--muted); font-style: italic; font-size: 12.5px; }
  .badge { font-size: 10.5px; padding: 2px 7px; border-radius: 6px; border: 1px solid var(--border); }
  .badge.auto_fix, .badge.applied, .badge.approved, .badge.valid { color: var(--ok); border-color: var(--ok); }
  .badge.requires_approval, .badge.pending, .badge.pending_approval, .badge.expiring_soon { color: var(--warn); border-color: var(--warn); }
  .badge.rejected, .badge.failed, .badge.expired, .badge.invalid { color: var(--danger); border-color: var(--danger); }

  input[type="password"], input[type="text"] { background: var(--panel); border: 1px solid var(--border); color: var(--text); padding: 7px 10px; border-radius: 8px; font-size: 13px; width: 100%; }

  /* --- main / chat --- */
  .main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  .chat-log { flex: 1; overflow-y: auto; padding: 24px 0; display: flex; flex-direction: column; gap: 16px; }
  .chat-log-inner { max-width: 760px; margin: 0 auto; width: 100%; min-height: 100%; padding: 0 24px; display: flex; flex-direction: column; gap: 16px; }
  .chat-msg-row { display: flex; }
  .chat-msg-row.user { justify-content: flex-end; }
  .chat-msg { padding: 10px 14px; border-radius: 12px; font-size: 14px; white-space: pre-wrap; word-break: break-word; max-width: 85%; }
  .chat-msg-row.user .chat-msg { background: var(--accent); color: #fff; border-bottom-right-radius: 3px; }
  .chat-msg-row.assistant .chat-msg { background: var(--panel); border: 1px solid var(--border); border-bottom-left-radius: 3px; }
  .tool-note { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
  .tool-note span { font-size: 10.5px; padding: 2px 7px; border-radius: 6px; background: rgba(255,255,255,0.05); color: var(--muted); }
  .tool-note span.ok { color: var(--ok); }
  .tool-note span.err { color: var(--danger); }

  .attachment-chip { display: inline-flex; align-items: center; gap: 6px; background: rgba(255,255,255,0.06); border-radius: 8px; padding: 4px 8px; font-size: 11.5px; margin-top: 6px; }

  .widget { margin-top: 10px; background: var(--bg-elev); border: 1px solid var(--border); border-radius: 10px; padding: 12px 14px; max-width: 480px; }
  .widget-title { font-size: 12px; font-weight: 600; color: var(--muted); margin-bottom: 10px; text-transform: uppercase; letter-spacing: 0.04em; }
  .chart-row { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; font-size: 12.5px; }
  .chart-label { width: 100px; flex-shrink: 0; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .chart-bar-track { flex: 1; background: rgba(255,255,255,0.06); border-radius: 4px; height: 16px; overflow: hidden; }
  .chart-bar-fill { background: var(--accent); height: 100%; border-radius: 4px; }
  .chart-value { width: 56px; text-align: right; flex-shrink: 0; color: var(--text); font-variant-numeric: tabular-nums; }
  .widget-list-item { padding: 6px 0; border-bottom: 1px solid rgba(255,255,255,0.05); }
  .widget-list-item:last-child { border-bottom: none; }
  .widget-list-primary { font-size: 13px; }
  .widget-list-secondary { font-size: 12px; color: var(--muted); }
  .widget-list-meta { font-size: 11px; color: var(--muted); margin-top: 2px; }
  .widget img { max-width: 100%; border-radius: 8px; display: block; }
  .widget-caption { font-size: 11.5px; color: var(--muted); margin-top: 6px; }

  .composer { border-top: 1px solid var(--border); padding: 16px 24px 20px; }
  .composer-inner { max-width: 760px; margin: 0 auto; }
  .pending-attachments { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 8px; }
  .pending-attachments .attachment-chip button { margin-left: 2px; }
  .composer-row { display: flex; gap: 8px; align-items: flex-end; }
  .composer-row input[type="text"] { flex: 1; }
  .composer-row input[type="file"] { display: none; }

  .connect-screen { flex: 1; display: flex; align-items: center; justify-content: center; flex-direction: column; gap: 14px; color: var(--muted); }
  .connect-screen .box { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 24px; width: 320px; display: flex; flex-direction: column; gap: 10px; }
  .connect-screen h2 { margin: 0; font-size: 15px; color: var(--text); }
  .connect-error { color: var(--danger); font-size: 12.5px; }

  .welcome { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; text-align: center; padding: 0 24px; }
  .welcome-mark { font-size: 34px; }
  .welcome h2 { margin: 0; font-size: 19px; color: var(--text); font-weight: 600; }
  .welcome p { margin: 0; color: var(--muted); font-size: 13.5px; max-width: 380px; }
  .welcome-prompts { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; max-width: 520px; }
  .welcome-prompts button { background: var(--panel); border: 1px solid var(--border); color: var(--text); padding: 8px 14px; border-radius: 20px; font-size: 12.5px; }
  .welcome-prompts button:hover { border-color: var(--accent); color: var(--accent); }

  @media (max-width: 800px) {
    .sidebar { position: fixed; z-index: 10; height: 100vh; transform: translateX(-100%); transition: transform 0.15s ease; }
    .sidebar.open { transform: translateX(0); }
  }
</style>
</head>
<body>
<div id="app" style="display:none">
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <h1><span class="status-dot" id="statusDot"></span> JARVIS</h1>
      <button class="icon-btn" id="settingsBtn" title="Connection settings">&#9881;</button>
    </div>
    <div id="sidebarSections"></div>
  </aside>
  <main class="main">
    <div class="chat-log" id="chatLog"><div class="chat-log-inner" id="chatLogInner"></div></div>
    <div class="composer">
      <div class="composer-inner">
        <div class="pending-attachments" id="pendingAttachments"></div>
        <div class="composer-row">
          <button class="icon-btn" id="attachBtn" title="Attach a file">&#128206;</button>
          <input type="file" id="fileInput" accept="image/png,image/jpeg,image/gif,image/webp,application/pdf" />
          <input type="text" id="messageInput" placeholder="Message JARVIS…" />
          <button class="primary" id="sendBtn">Send</button>
        </div>
      </div>
    </div>
  </main>
</div>

<div class="connect-screen" id="connectScreen">
  <div class="box">
    <h2>Connect to JARVIS</h2>
    <input id="tokenInput" type="password" placeholder="Dashboard token" />
    <button class="primary" id="connectBtn">Connect</button>
    <div class="connect-error" id="connectError"></div>
  </div>
</div>

<script>
let TOKEN = localStorage.getItem("jarvis_dashboard_token") || "";
let sessionId = localStorage.getItem("jarvis_chat_session") || crypto.randomUUID();
localStorage.setItem("jarvis_chat_session", sessionId);
let pendingAttachments = []; // { mediaType, base64Data, filename }

function authHeaders() { return TOKEN ? { authorization: "Bearer " + TOKEN } : {}; }

async function api(path, opts = {}) {
  const res = await fetch(path, { ...opts, headers: { "content-type": "application/json", ...authHeaders(), ...(opts.headers || {}) } });
  if (!res.ok) {
    const body = await res.json().catch(() => ({}));
    // res.statusText is unreliable (HTTP/2 responses — e.g. via Cloudflare —
    // have no reason phrase, so browsers report it as ""), so always fall
    // back to the numeric status rather than risking a blank error.
    throw new Error(body.error || res.statusText || `HTTP ${res.status}`);
  }
  return res.status === 204 ? null : res.json();
}

function el(tag, attrs = {}, children = []) {
  const node = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === "text") node.textContent = v;
    else if (k.startsWith("on")) node.addEventListener(k.slice(2), v);
    else node.setAttribute(k, v);
  }
  for (const c of [].concat(children)) node.appendChild(c);
  return node;
}

function badge(text, cls) { return el("span", { class: "badge " + cls, text }); }

// ---------- chat log persistence ----------
function chatLog() { try { return JSON.parse(localStorage.getItem("jarvis_chat_log") || "[]"); } catch { return []; } }
function saveChatLog(log) { localStorage.setItem("jarvis_chat_log", JSON.stringify(log.slice(-200))); }

function renderChatMessage(msg) {
  const row = el("div", { class: "chat-msg-row " + msg.role });
  const bubble = el("div", { class: "chat-msg" });
  if (msg.text) bubble.appendChild(document.createTextNode(msg.text));

  for (const att of msg.attachments || []) {
    bubble.appendChild(el("div", { class: "attachment-chip", text: "📎 " + (att.filename || att.mediaType) }));
  }

  if (msg.toolCalls && msg.toolCalls.length > 0) {
    const note = el("div", { class: "tool-note" });
    for (const t of msg.toolCalls) note.appendChild(el("span", { class: t.ok ? "ok" : "err", text: (t.ok ? "✓ " : "✗ ") + t.capability }));
    bubble.appendChild(note);
  }

  for (const widget of msg.widgets || []) bubble.appendChild(renderWidget(widget));

  row.appendChild(bubble);
  return row;
}

function renderWidget(widget) {
  const box = el("div", { class: "widget" });
  if (widget.type === "chart") {
    box.appendChild(el("div", { class: "widget-title", text: widget.title || "Chart" }));
    const max = Math.max(1, ...widget.series.map((s) => Number(s.value) || 0));
    for (const point of widget.series) {
      const pct = Math.max(2, (Number(point.value) || 0) / max * 100);
      const row = el("div", { class: "chart-row" });
      row.appendChild(el("div", { class: "chart-label", text: point.label }));
      row.appendChild(el("div", { class: "chart-bar-track" }, [el("div", { class: "chart-bar-fill", style: `width:${pct}%` })]));
      row.appendChild(el("div", { class: "chart-value", text: point.value + (widget.unit || "") }));
      box.appendChild(row);
    }
  } else if (widget.type === "list") {
    box.appendChild(el("div", { class: "widget-title", text: widget.title || "List" }));
    for (const item of widget.items) {
      const row = el("div", { class: "widget-list-item" });
      row.appendChild(el("div", { class: "widget-list-primary", text: item.primary }));
      if (item.secondary) row.appendChild(el("div", { class: "widget-list-secondary", text: item.secondary }));
      if (item.meta) row.appendChild(el("div", { class: "widget-list-meta", text: item.meta }));
      box.appendChild(row);
    }
  } else if (widget.type === "image") {
    box.appendChild(el("img", { src: widget.url }));
    if (widget.caption) box.appendChild(el("div", { class: "widget-caption", text: widget.caption }));
  }
  return box;
}

const EXAMPLE_PROMPTS = [
  "What's this VM's performance looking like?",
  "Show me my last few emails",
  "What's on my calendar this week?",
  "Any open reviewer proposals?",
];

function renderWelcome() {
  const box = el("div", { class: "welcome" });
  box.appendChild(el("div", { class: "welcome-mark", text: "●" }));
  box.appendChild(el("h2", { text: "JARVIS is ready" }));
  box.appendChild(el("p", { text: "One assistant, one memory, across work and everything else. Ask a question, attach a file, or try one of these:" }));
  const prompts = el("div", { class: "welcome-prompts" });
  for (const p of EXAMPLE_PROMPTS) {
    prompts.appendChild(el("button", { text: p, onclick: () => { document.getElementById("messageInput").value = p; sendMessage(); } }));
  }
  box.appendChild(prompts);
  return box;
}

function renderChatLog() {
  const inner = document.getElementById("chatLogInner");
  inner.innerHTML = "";
  const log = chatLog();
  if (log.length === 0) {
    inner.appendChild(renderWelcome());
    return;
  }
  for (const msg of log) inner.appendChild(renderChatMessage(msg));
  document.getElementById("chatLog").scrollTop = 999999;
}

// ---------- attachments ----------
function fileToBase64(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result.split(",")[1]);
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

function renderPendingAttachments() {
  const container = document.getElementById("pendingAttachments");
  container.innerHTML = "";
  pendingAttachments.forEach((att, i) => {
    const chip = el("span", { class: "attachment-chip" }, [
      document.createTextNode("📎 " + (att.filename || att.mediaType)),
      el("button", { class: "tiny", text: "×", onclick: () => { pendingAttachments.splice(i, 1); renderPendingAttachments(); } }),
    ]);
    container.appendChild(chip);
  });
}

document.getElementById("attachBtn").addEventListener("click", () => document.getElementById("fileInput").click());
document.getElementById("fileInput").addEventListener("change", async (e) => {
  for (const file of e.target.files) {
    const base64Data = await fileToBase64(file);
    pendingAttachments.push({ mediaType: file.type, base64Data, filename: file.name });
  }
  e.target.value = "";
  renderPendingAttachments();
});

// ---------- send ----------
async function sendMessage() {
  const input = document.getElementById("messageInput");
  const text = input.value.trim();
  if (!text && pendingAttachments.length === 0) return;
  input.value = "";
  const sendBtn = document.getElementById("sendBtn");
  sendBtn.disabled = true;

  const log = chatLog();
  log.push({ role: "user", text, attachments: pendingAttachments.map((a) => ({ mediaType: a.mediaType, filename: a.filename })) });
  saveChatLog(log);
  renderChatLog();

  const attachmentsToSend = pendingAttachments;
  pendingAttachments = [];
  renderPendingAttachments();

  try {
    const result = await api("/api/chat", {
      method: "POST",
      body: JSON.stringify({ sessionId, message: text, attachments: attachmentsToSend }),
    });
    const withReply = chatLog();
    withReply.push({ role: "assistant", text: result.reply, toolCalls: result.toolCalls, widgets: result.widgets });
    saveChatLog(withReply);
  } catch (e) {
    const withError = chatLog();
    withError.push({ role: "assistant", text: "(error: " + e.message + ")" });
    saveChatLog(withError);
  }
  sendBtn.disabled = false;
  renderChatLog();
}
document.getElementById("sendBtn").addEventListener("click", sendMessage);
document.getElementById("messageInput").addEventListener("keydown", (e) => { if (e.key === "Enter") sendMessage(); });

// ---------- sidebar ----------
async function renderSidebar() {
  const container = document.getElementById("sidebarSections");
  container.innerHTML = "";

  // health
  const health = await api("/api/health").catch(() => null);
  const healthSection = el("div", { class: "section" });
  healthSection.appendChild(el("h2", { text: "Health" }));
  document.getElementById("statusDot").className = "status-dot " + (health ? "ok" : "err");
  if (!health) {
    healthSection.appendChild(el("div", { class: "empty", text: "no health report yet" }));
  } else {
    healthSection.appendChild(el("div", { class: "item-row" }, [
      el("div", { class: "item-sub", text: "last reported" }),
      el("div", { class: "item-sub", text: new Date(health.reportedAt).toLocaleTimeString() }),
    ]));
    for (const c of health.credentialStatus) {
      healthSection.appendChild(el("div", { class: "item-row" }, [
        el("div", { class: "item-title", text: c.credentialRef }),
        badge(c.status, c.status === "valid" ? "valid" : c.status === "expiring_soon" ? "expiring_soon" : "invalid"),
      ]));
    }
  }
  container.appendChild(healthSection);

  // proposals
  const proposals = await api("/api/proposals?status=pending").catch(() => []);
  const propSection = el("div", { class: "section" });
  propSection.appendChild(el("h2", {}, [document.createTextNode("Proposals"), proposals.length ? el("span", { class: "count-badge", text: String(proposals.length) }) : document.createTextNode("")]));
  if (proposals.length === 0) propSection.appendChild(el("div", { class: "empty", text: "none pending" }));
  for (const p of proposals) {
    const row = el("div", { class: "item-row" });
    row.appendChild(el("div", { class: "item-main" }, [
      el("div", { class: "item-title", text: p.summary }),
      el("div", { class: "item-sub", text: p.category }),
    ]));
    row.appendChild(el("div", { class: "btn-row" }, [
      el("button", { class: "tiny", text: "Ack", onclick: async () => { await api(`/api/proposals/${p.id}/approve`, { method: "POST" }); renderSidebar(); } }),
      el("button", { class: "tiny danger", text: "Dismiss", onclick: async () => { await api(`/api/proposals/${p.id}/reject`, { method: "POST" }); renderSidebar(); } }),
    ]));
    propSection.appendChild(row);
  }
  container.appendChild(propSection);

  // scripts
  const scripts = await api("/api/scripts").catch(() => []);
  const scriptSection = el("div", { class: "section" });
  scriptSection.appendChild(el("h2", { text: "Scripts" }));
  for (const s of scripts) {
    const row = el("div", { class: "item-row" });
    row.appendChild(el("div", { class: "item-main" }, [
      el("div", { class: "item-title", text: s.name }),
      el("div", { class: "item-sub", text: s.description }),
    ]));
    const right = el("div", { class: "btn-row" });
    right.appendChild(badge(s.trustTier, s.trustTier));
    right.appendChild(el("button", {
      class: "tiny",
      text: "Run",
      onclick: async () => {
        let args = {};
        if (s.name === "apply-migration") {
          const file = prompt("migration filename (must exist in db/migrations/):");
          if (!file) return;
          args = { file };
        }
        try {
          const result = await api(`/api/scripts/${s.name}/run`, { method: "POST", body: JSON.stringify({ args }) });
          alert(result.status === "pending_approval" ? "Proposed — needs approval below." : "Applied.");
          renderSidebar();
        } catch (e) { alert("Failed: " + e.message); }
      },
    }));
    row.appendChild(right);
    scriptSection.appendChild(row);
  }
  const runs = await api("/api/script-runs").catch(() => []);
  const pendingRuns = runs.filter((r) => r.status === "pending_approval");
  for (const r of pendingRuns) {
    const row = el("div", { class: "item-row" });
    row.appendChild(el("div", { class: "item-main" }, [el("div", { class: "item-title", text: r.scriptName }), el("div", { class: "item-sub", text: r.detail || "" })]));
    row.appendChild(el("div", { class: "btn-row" }, [
      el("button", { class: "tiny", text: "Approve", onclick: async () => { await api(`/api/scripts/${r.id}/approve`, { method: "POST" }); renderSidebar(); } }),
      el("button", { class: "tiny danger", text: "Reject", onclick: async () => { await api(`/api/scripts/${r.id}/reject`, { method: "POST" }); renderSidebar(); } }),
    ]));
    scriptSection.appendChild(row);
  }
  container.appendChild(scriptSection);

  // capabilities, grouped by freeform category
  const caps = await api("/api/capabilities").catch(() => []);
  const byCategory = new Map();
  for (const c of caps) {
    const key = c.category || "uncategorized";
    if (!byCategory.has(key)) byCategory.set(key, []);
    byCategory.get(key).push(c);
  }
  const capSection = el("div", { class: "section" });
  capSection.appendChild(el("h2", { text: "Capabilities" }));
  if (caps.length === 0) capSection.appendChild(el("div", { class: "empty", text: "none registered" }));
  for (const [category, items] of byCategory) {
    for (const c of items) {
      const row = el("div", { class: "item-row" });
      row.appendChild(el("div", { class: "item-main" }, [
        el("div", { class: "item-title" }, [document.createTextNode(c.name), el("span", { class: "cat-chip", text: category })]),
        el("div", { class: "item-sub", text: c.credentialRef ? "cred: " + c.credentialRef : "" }),
      ]));
      const right = el("div", { class: "btn-row" });
      if (c.oauthConfigured) {
        right.appendChild(el("button", {
          class: "tiny",
          text: "Connect",
          onclick: async () => {
            try {
              const { url } = await api(`/api/oauth/${encodeURIComponent(c.credentialRef)}/authorize-url`);
              window.location.href = url; // leaves the page for Microsoft's consent screen
            } catch (e) { alert("Failed: " + e.message); }
          },
        }));
      }
      right.appendChild(el("button", {
        class: "tiny",
        text: c.enabled ? "Disable" : "Enable",
        onclick: async () => { await api(`/api/capabilities/${c.name}/enabled`, { method: "POST", body: JSON.stringify({ enabled: !c.enabled }) }); renderSidebar(); },
      }));
      row.appendChild(right);
      capSection.appendChild(row);
    }
  }
  container.appendChild(capSection);
}

// ---------- connect flow ----------
function checkOauthRedirect() {
  const params = new URLSearchParams(window.location.search);
  const connected = params.get("oauth_connected");
  if (!connected) return;
  history.replaceState(null, "", window.location.pathname); // drop the query param so a refresh doesn't re-show this
  alert(`Connected "${connected}" — it can be used right away, no redeploy needed.`);
}

async function tryConnect() {
  try {
    await api("/api/health");
    document.getElementById("connectScreen").style.display = "none";
    document.getElementById("app").style.display = "flex";
    renderChatLog();
    checkOauthRedirect();
    await renderSidebar();
    setInterval(renderSidebar, 30000);
    return true;
  } catch (e) {
    document.getElementById("connectScreen").style.display = "flex";
    document.getElementById("app").style.display = "none";
    document.getElementById("connectError").textContent = e.message === "unauthorized" ? "Invalid token." : e.message;
    return false;
  }
}

document.getElementById("connectBtn").addEventListener("click", async () => {
  TOKEN = document.getElementById("tokenInput").value.trim();
  localStorage.setItem("jarvis_dashboard_token", TOKEN);
  await tryConnect();
});
document.getElementById("settingsBtn").addEventListener("click", () => {
  document.getElementById("connectScreen").style.display = "flex";
  document.getElementById("app").style.display = "none";
  document.getElementById("tokenInput").value = TOKEN;
});
document.getElementById("tokenInput").value = TOKEN;

tryConnect();
</script>
</body>
</html>
