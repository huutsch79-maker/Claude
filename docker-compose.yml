services:
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: jarvis
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${JARVIS_DB_SUPERUSER_PASSWORD:-change_me_superuser}
    volumes:
      - jarvis_db_data:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  orchestrator:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      JARVIS_DB_HOST: db
      JARVIS_DB_PORT: "5432"
      JARVIS_DB_NAME: jarvis
    ports:
      # Bound to all interfaces so it's reachable from other devices on the
      # LAN (e.g. a laptop browser), not just the NUC itself. This is why
      # JARVIS_DASHBOARD_TOKEN in .env matters — set it before relying on
      # this beyond a trusted home network.
      - "4570:4570"

volumes:
  jarvis_db_data:
