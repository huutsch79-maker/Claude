services:
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: jarvis
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${JARVIS_DB_SUPERUSER_PASSWORD:-change_me_superuser}
    volumes:
      - jarvis_db_data:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  orchestrator:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      JARVIS_DB_HOST: db
      JARVIS_DB_PORT: "5432"
      JARVIS_DB_NAME: jarvis
    ports:
      # Bound to all interfaces so it's reachable from other devices on the
      # LAN (e.g. a laptop browser), not just the NUC itself. This is why
      # JARVIS_DASHBOARD_TOKEN in .env matters — set it before relying on
      # this beyond a trusted home network.
      - "4570:4570"

  # Serves waikatohighlands.com and rebuilds it on demand — see
  # docs/architecture.md "Website module". Content and the Astro/Sveltia
  # CMS site code live in a separate GitHub repo (WEBSITE_GITHUB_REPO),
  # cloned into the website_site volume at startup and re-pulled whenever
  # the farm-website module or the CMS admin commits a change.
  website:
    build: ./website-server
    restart: unless-stopped
    environment:
      WEBSITE_GITHUB_REPO: ${JARVIS_WEBSITE_GITHUB_REPO:-}
      WEBSITE_GITHUB_BRANCH: ${JARVIS_WEBSITE_GITHUB_BRANCH:-main}
      WEBSITE_GITHUB_TOKEN: ${JARVIS_CRED_WEBSITE_GITHUB:-}
    volumes:
      - website_site:/data/site
    ports:
      # Loopback-only, same reasoning as db's binding below: this assumes
      # cloudflared runs directly on the NUC (the common setup) and reaches
      # the public site over localhost. If cloudflared instead runs as
      # another container on this same compose network, drop this
      # `ports:` block entirely — it can already reach this service at
      # http://website:8080 by service name, no host port needed. Either
      # way, port 8081 (the internal rebuild webhook) is never published
      # here — the orchestrator reaches it over the compose network only,
      # and it must never get a Cloudflare Tunnel hostname of its own.
      - "127.0.0.1:8080:8080"

  # Self-deploy for JARVIS itself (git pull + rebuild the orchestrator) —
  # see docs/architecture.md "Self-deploy". This is the ONLY service in
  # this file with Docker-socket access — deliberately never added to
  # orchestrator, since that would be root-equivalent host access reachable
  # through anything that can reach chat. deploy-agent exposes exactly two
  # fixed, parameterless operations (git pull; docker compose build+up
  # orchestrator) with no other surface, and every real invocation is
  # gated upstream by a human approval (the redeploy-jarvis bounded
  # script is requires_approval, never auto_fix).
  #
  # JARVIS_HOST_REPO_PATH must be this repo's actual absolute path ON THE
  # NUC (e.g. /home/alfred/jarvis-v2) — required, no default. It's bind-
  # mounted at the SAME path inside this container on purpose: commands
  # this container sends over the Docker socket run against the HOST
  # daemon, which resolves file paths against the host filesystem, not
  # this container's — mirroring the path is what makes `docker compose
  # -f $JARVIS_HOST_REPO_PATH/docker-compose.yml ...` resolve correctly
  # from both sides of that socket.
  deploy-agent:
    build: ./deploy-agent
    restart: unless-stopped
    environment:
      JARVIS_HOST_REPO_PATH: ${JARVIS_HOST_REPO_PATH:?set this to this repo's absolute path on the NUC, e.g. /home/alfred/jarvis-v2}
    volumes:
      - ${JARVIS_HOST_REPO_PATH:-.}:${JARVIS_HOST_REPO_PATH:-/repo}
      - /var/run/docker.sock:/var/run/docker.sock
    # No `ports:` at all — reachable only from the orchestrator over the
    # compose network (http://deploy-agent:8082), never the host, never a
    # Cloudflare Tunnel hostname.

volumes:
  jarvis_db_data:
  website_site:
